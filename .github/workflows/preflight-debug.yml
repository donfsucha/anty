name: Preflight parser diagnostics

on:
  push:
    branches:
      - agent/mission-flow-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save acorn@8
      - run: node tests/preflight-token-debug.mjs
      - run: npx acorn preflight-verification.js --ecma2022 || true
