name: Validate connected mission flow

on:
  push:
    branches:
      - agent/mission-flow-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax check
        run: |
          node --check core.js
          node --check views.js
          node --check app.js
          node --check flow-sync-core.js
          node --check flow-sync-views.js
          node --check flow-sync-events.js
          node --check service-worker.js
          node --check tests/flow-smoke.mjs
      - name: Required file check
        run: |
          test -f index.html
          test -f flow-sync.css
          grep -q 'flow-sync-core.js' index.html
          grep -q 'flow-sync-views.js' index.html
          grep -q 'flow-sync-events.js' index.html
      - name: Browser smoke test
        run: |
          npm init -y
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
          python3 -m http.server 5500 --bind 127.0.0.1 >/tmp/dlogis-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tests/flow-smoke.mjs
