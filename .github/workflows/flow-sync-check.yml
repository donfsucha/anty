name: Validate connected mission flow

on:
  push:
    branches:
      - agent/mission-flow-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax check
        run: |
          set -e
          for file in core.js views.js app.js flow-sync-core.js stage-sequence-fix.js flow-sync-views.js stagebar-ux.js system-consistency.js data-quality.js precision-runtime.js view-alias-fix.js asset-visuals.js preflight-verification.js operations-map.js inline-live-map.js flow-sync-events.js drone-detail-ux.js modal-actions-fix.js excel-report.js agency-report.js layout-optimizer.js report-observer-guard.js report-observer-release.js button-stability.js service-worker.js tests/flow-smoke.mjs tests/inline-map-smoke.mjs tests/excel-report-smoke.mjs tests/responsive-layout-smoke.mjs tests/workspace-layout-smoke.mjs tests/button-stability-smoke.mjs; do
            node --check "$file"
          done

      - name: Required file check
        run: |
          set -e
          for file in index.html flow-sync.css stagebar-ux.css system-consistency.css data-quality.css drone-detail-ux.css asset-visuals.css preflight-verification.css operations-map.css inline-live-map.css excel-report.css agency-report.css responsive-layout.css workspace-layout.css system-consistency.js data-quality.js precision-runtime.js view-alias-fix.js asset-visuals.js preflight-verification.js operations-map.js inline-live-map.js excel-report.js agency-report.js layout-optimizer.js report-observer-guard.js report-observer-release.js button-stability.js; do
            test -f "$file"
          done
          grep -q 'system-consistency.js' index.html
          grep -q 'data-quality.js' index.html
          grep -q 'precision-runtime.js' index.html
          grep -q 'view-alias-fix.js' index.html
          grep -q 'asset-visuals.js' index.html
          grep -q 'preflight-verification.js' index.html
          grep -q 'operations-map.js' index.html
          grep -q 'inline-live-map.js' index.html
          grep -q 'excel-report.js' index.html
          grep -q 'agency-report.js' index.html
          grep -q 'report-observer-guard.js' index.html
          grep -q 'report-observer-release.js' index.html
          grep -q 'button-stability.js' index.html
          grep -q 'responsive-layout.css' index.html
          grep -q 'workspace-layout.css' index.html
          grep -q 'layout-optimizer.js' index.html
          grep -q 'preflight-verification.css' index.html
          grep -q 'operations-map.css' index.html
          grep -q 'inline-live-map.css' index.html
          grep -q 'excel-report.css' index.html
          grep -q 'agency-report.css' index.html
          grep -q 'drone-detail-ux.js' index.html

      - name: Browser smoke test
        run: |
          npm init -y
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
          python3 -m http.server 5500 --bind 127.0.0.1 >/tmp/dlogis-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tests/flow-smoke.mjs
          node tests/inline-map-smoke.mjs
          node tests/excel-report-smoke.mjs
          node tests/responsive-layout-smoke.mjs
          node tests/workspace-layout-smoke.mjs
          node tests/button-stability-smoke.mjs
