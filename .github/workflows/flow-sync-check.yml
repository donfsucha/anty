name: Validate connected mission flow

on:
  push:
    branches:
      - agent/mission-flow-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax check
        run: |
          set -e
          for file in core.js views.js app.js flow-sync-core.js stage-sequence-fix.js flow-sync-views.js stagebar-ux.js system-consistency.js data-quality.js precision-runtime.js view-alias-fix.js asset-visuals.js preflight-verification.js operations-map.js flow-sync-events.js drone-detail-ux.js modal-actions-fix.js service-worker.js tests/flow-smoke.mjs; do
            node --check "$file"
          done

      - name: Required file check
        run: |
          set -e
          for file in index.html flow-sync.css stagebar-ux.css system-consistency.css data-quality.css drone-detail-ux.css asset-visuals.css preflight-verification.css operations-map.css system-consistency.js data-quality.js precision-runtime.js view-alias-fix.js asset-visuals.js preflight-verification.js operations-map.js; do
            test -f "$file"
          done
          grep -q 'system-consistency.js' index.html
          grep -q 'data-quality.js' index.html
          grep -q 'precision-runtime.js' index.html
          grep -q 'view-alias-fix.js' index.html
          grep -q 'asset-visuals.js' index.html
          grep -q 'preflight-verification.js' index.html
          grep -q 'operations-map.js' index.html
          grep -q 'preflight-verification.css' index.html
          grep -q 'operations-map.css' index.html
          grep -q 'drone-detail-ux.js' index.html

      - name: Browser smoke test
        run: |
          npm init -y
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
          python3 -m http.server 5500 --bind 127.0.0.1 >/tmp/dlogis-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tests/flow-smoke.mjs
