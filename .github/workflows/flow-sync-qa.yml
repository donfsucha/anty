name: D-LOGIS Flow Sync QA

on:
  push:
    branches:
      - agent/mission-flow-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -e
          for file in core.js views.js app.js flow-sync-core.js stage-sequence-fix.js flow-sync-views.js stagebar-ux.js system-consistency.js data-quality.js precision-runtime.js view-alias-fix.js asset-visuals.js preflight-verification.js operations-map.js map-resilience.js inline-live-map.js flow-sync-events.js drone-detail-ux.js modal-actions-fix.js excel-report.js agency-report.js unified-report-mode.js stable-report-controls.js layout-optimizer.js report-observer-guard.js report-observer-release.js button-stability.js notification-lifecycle.js interaction-stability.js mission-repeat.js mission-map-sync.js maintenance-clearance.js service-worker.js; do
            node --check "$file"
          done

      - name: Required files and references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="\./([^"]+)"', html)
          missing = [ref for ref in refs if not Path(ref).exists()]
          if missing:
              raise SystemExit(f'Missing referenced files: {missing}')
          required = ['design-tokens.css','system-consistency.js','data-quality.js','precision-runtime.js','view-alias-fix.js','asset-visuals.js','preflight-verification.js','operations-map.js','map-resilience.js','inline-live-map.js','excel-report.js','agency-report.js','unified-report-mode.js','stable-report-controls.js','layout-optimizer.js','report-observer-guard.js','report-observer-release.js','button-stability.js','notification-lifecycle.js','interaction-stability.js','mission-repeat.js','mission-map-sync.js','maintenance-clearance.js','drone-detail-ux.js','system-consistency.css','data-quality.css','asset-visuals.css','preflight-verification.css','operations-map.css','inline-live-map.css','map-resilience.css','excel-report.css','agency-report.css','responsive-layout.css','workspace-layout.css','notification-lifecycle.css','mission-repeat.css','maintenance-clearance.css','drone-detail-ux.css','tests/maintenance-clearance-smoke.mjs']
          missing_required = [name for name in required if not Path(name).exists()]
          if missing_required:
              raise SystemExit(f'Missing QA files: {missing_required}')
          print('Static references OK')
          PY

      - name: Consistency, verification, map, Excel, layout, mission history and stability rules
        run: |
          grep -q "flowOperationalSnapshot" system-consistency.js
          grep -q "운항 중 드론" system-consistency.js
          grep -q "mapActiveCount" system-consistency.js
          grep -q "flowCellDeltaMv" data-quality.js
          grep -q "dashboard=flowDashboard" view-alias-fix.js
          grep -q "fleet-aircraft-card" asset-visuals.js
          grep -q "energy-battery-card" asset-visuals.js
          grep -q "battery-detail-modal" asset-visuals.js
          grep -q "PREFLIGHT_SIGNOFF" preflight-verification.js
          grep -q "PHOTO_HASH" preflight-verification.js
          grep -q "APPROVAL_REFERENCE" preflight-verification.js
          grep -q "ops-map-planned" operations-map.js
          grep -q "항로 편차" operations-map.js
          grep -q "DEFAULT_CENTER=\[37.5032,126.7652\]" map-resilience.js
          grep -q "https://tile.openstreetmap.org/{z}/{x}/{y}.png" map-resilience.js
          grep -q "ensureDefaultView" map-resilience.js
          grep -q "data-map-tile-retry" map-resilience.js
          grep -q "dlogis-map-tile-status" map-resilience.css
          grep -q "active and empty mission states" tests/inline-map-smoke.mjs
          grep -q "inline-live-map" inline-live-map.js
          grep -q "MAP_ACTIVE_STATUSES" mission-map-sync.js
          grep -q "data-track-mission" mission-map-sync.js
          grep -q "dlogis:mission-map-sync" mission-map-sync.js
          grep -q "active mission-to-map synchronization smoke test" tests/mission-map-sync-smoke.mjs
          grep -q "PERIODIC AIRCRAFT CLEARANCE" maintenance-clearance.js
          grep -q "validityFlightHours" maintenance-clearance.js
          grep -q "QUICK_DISPATCH_SIGNOFF" maintenance-clearance.js
          grep -q "data-open-quick-dispatch" maintenance-clearance.js
          grep -q "긴급복귀 실행 후 기체 재점검 필요" maintenance-clearance.js
          grep -q "mc-board" maintenance-clearance.css
          grep -q "one-screen quick dispatch smoke test" tests/maintenance-clearance-smoke.mjs
          grep -q "ExcelJS" excel-report.js
          grep -q "기관보고서 Excel" agency-report.js
          grep -q "01_임무별_종합" agency-report.js
          grep -q "02_운항안전_요약" agency-report.js
          grep -q "03_검증승인_요약" agency-report.js
          grep -q "04_배송증빙" agency-report.js
          grep -q "종합보고서 Excel" unified-report-mode.js
          grep -q "DLOGIS_종합보고서" unified-report-mode.js
          grep -q "REPORT_SELECTOR" unified-report-mode.js
          grep -q "addUnifiedReportButton" stable-report-controls.js
          grep -q "removeLegacyReportButtons" stable-report-controls.js
          grep -q "data-unified-report" stable-report-controls.js
          grep -q "xlsx" tests/excel-report-smoke.mjs
          grep -q "Raw telemetry" tests/excel-report-smoke.mjs
          grep -q "yyyy-mm-dd hh:mm:ss" agency-report.js
          grep -q "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" agency-report.js
          grep -q "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" unified-report-mode.js
          grep -q -- "--blue-600:var(--blue2,#1d5fd1)" design-tokens.css
          grep -q "mission-scope-tab\[aria-selected=\"true\"\]" design-tokens.css
          grep -q "MISSION_STATUS_GROUPS" mission-repeat.js
          grep -q "승인 완료·출동 준비" mission-repeat.js
          grep -q "repeatOfMissionId" mission-repeat.js
          grep -q "rootMissionId" mission-repeat.js
          grep -q "PREFER_PREVIOUS" mission-repeat.js
          grep -q "원본 수행기록은 변경하지 않고" mission-repeat.js
          grep -q "mission-repeat-chip" mission-repeat.css
          grep -q "visible mission tabs" tests/mission-repeat-smoke.mjs
          grep -q "isDocumentWideButtonObserver" report-observer-guard.js
          grep -q "__dlogisNativeMutationObserver" report-observer-release.js
          grep -q "button:not(\[type\])" button-stability.js
          grep -q "recoverEmptyApp" button-stability.js
          grep -q "button stability smoke test" tests/button-stability-smoke.mjs
          grep -q "SUCCESS_VISIBLE_MS=12000" notification-lifecycle.js
          grep -q "pauseDismiss" notification-lifecycle.js
          grep -q "resumeDismiss" notification-lifecycle.js
          grep -q "operation-dock-dismiss" notification-lifecycle.js
          grep -q "notification lifecycle smoke test" tests/notification-lifecycle-smoke.mjs
          grep -q "notification-paused" notification-lifecycle.css
          grep -q "INTERACTIVE_SELECTOR" interaction-stability.js
          grep -q "originalTelemetryTick" interaction-stability.js
          grep -q "suppressedRenderCount" interaction-stability.js
          grep -q "interaction and button stability smoke test" tests/interaction-stability-smoke.mjs
          grep -q "DESKTOP : >= 1180px" responsive-layout.css
          grep -q "consistency-banner+.dashboard-grid" responsive-layout.css
          grep -q "@media (max-width:1179.98px)" responsive-layout.css
          grep -q "mission-workspace" workspace-layout.css
          grep -q "grid-template-columns:minmax(0,1fr)!important" workspace-layout.css
          grep -q "mission-table thead{display:none}" workspace-layout.css
          grep -q "dataset.appView" layout-optimizer.js
          grep -q "labelTable" layout-optimizer.js
          grep -q "fleet-command-hero" asset-visuals.css
          grep -q "energy-command-hero" asset-visuals.css
          grep -q "pf-item" preflight-verification.css
          grep -q "ops-map-shell" operations-map.css
          grep -q "grid-template-columns:minmax(0,1fr) minmax(0,1fr)" drone-detail-ux.css
