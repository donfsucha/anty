name: D-LOGIS Flow Sync QA

on:
  push:
    branches:
      - agent/mission-flow-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -e
          for file in core.js views.js app.js flow-sync-core.js stage-sequence-fix.js flow-sync-views.js stagebar-ux.js system-consistency.js data-quality.js precision-runtime.js view-alias-fix.js asset-visuals.js preflight-verification.js operations-map.js inline-live-map.js flow-sync-events.js drone-detail-ux.js modal-actions-fix.js excel-report.js agency-report.js layout-optimizer.js report-observer-guard.js report-observer-release.js button-stability.js service-worker.js; do
            node --check "$file"
          done

      - name: Required files and references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="\./([^"]+)"', html)
          missing = [ref for ref in refs if not Path(ref).exists()]
          if missing:
              raise SystemExit(f'Missing referenced files: {missing}')
          required = ['system-consistency.js','data-quality.js','precision-runtime.js','view-alias-fix.js','asset-visuals.js','preflight-verification.js','operations-map.js','inline-live-map.js','excel-report.js','agency-report.js','layout-optimizer.js','report-observer-guard.js','report-observer-release.js','button-stability.js','drone-detail-ux.js','system-consistency.css','data-quality.css','asset-visuals.css','preflight-verification.css','operations-map.css','inline-live-map.css','excel-report.css','agency-report.css','responsive-layout.css','workspace-layout.css','drone-detail-ux.css']
          missing_required = [name for name in required if not Path(name).exists()]
          if missing_required:
              raise SystemExit(f'Missing QA files: {missing_required}')
          print('Static references OK')
          PY

      - name: Consistency, verification, map, Excel, layout and stability rules
        run: |
          grep -q "flowOperationalSnapshot" system-consistency.js
          grep -q "운항 중 드론" system-consistency.js
          grep -q "mapActiveCount" system-consistency.js
          grep -q "flowCellDeltaMv" data-quality.js
          grep -q "dashboard=flowDashboard" view-alias-fix.js
          grep -q "fleet-aircraft-card" asset-visuals.js
          grep -q "energy-battery-card" asset-visuals.js
          grep -q "battery-detail-modal" asset-visuals.js
          grep -q "PREFLIGHT_SIGNOFF" preflight-verification.js
          grep -q "PHOTO_HASH" preflight-verification.js
          grep -q "APPROVAL_REFERENCE" preflight-verification.js
          grep -q "ops-map-planned" operations-map.js
          grep -q "항로 편차" operations-map.js
          grep -q "inline-live-map" inline-live-map.js
          grep -q "ExcelJS" excel-report.js
          grep -q "기관보고서 Excel" agency-report.js
          grep -q "배송증빙 Excel" agency-report.js
          grep -q "운영리포트 Excel" agency-report.js
          grep -q "01_임무별_종합" agency-report.js
          grep -q "02_운항안전_요약" agency-report.js
          grep -q "03_검증승인_요약" agency-report.js
          grep -q "04_배송증빙" agency-report.js
          grep -q "Raw telemetry" tests/excel-report-smoke.mjs
          grep -q "yyyy-mm-dd hh:mm:ss" agency-report.js
          grep -q "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" agency-report.js
          grep -q "isDocumentWideButtonObserver" report-observer-guard.js
          grep -q "__dlogisNativeMutationObserver" report-observer-release.js
          grep -q "button:not(\[type\])" button-stability.js
          grep -q "recoverEmptyApp" button-stability.js
          grep -q "button stability smoke test" tests/button-stability-smoke.mjs
          grep -q "DESKTOP : >= 1180px" responsive-layout.css
          grep -q "consistency-banner+.dashboard-grid" responsive-layout.css
          grep -q "@media (max-width:1179.98px)" responsive-layout.css
          grep -q "mission-workspace" workspace-layout.css
          grep -q "grid-template-columns:minmax(0,1fr)!important" workspace-layout.css
          grep -q "mission-table thead{display:none}" workspace-layout.css
          grep -q "dataset.appView" layout-optimizer.js
          grep -q "labelTable" layout-optimizer.js
          grep -q "fleet-command-hero" asset-visuals.css
          grep -q "energy-command-hero" asset-visuals.css
          grep -q "pf-item" preflight-verification.css
          grep -q "ops-map-shell" operations-map.css
          grep -q "grid-template-columns:minmax(0,1fr) minmax(0,1fr)" drone-detail-ux.css
