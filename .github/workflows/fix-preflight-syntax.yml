name: Repair preflight syntax

on:
  push:
    branches:
      - agent/mission-flow-sync

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[preflight-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mission-flow-sync
      - name: Close modal field verification blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('preflight-verification.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          changed = False
          in_modal_fields = False
          repaired = []
          for line in lines:
              if 'function pfModalFields' in line:
                  in_modal_fields = True
              if in_modal_fields and ("if(key==='battery'){" in line or "if(key==='link'){" in line) and not line.rstrip().endswith('}'):
                  line = line + '}'
                  changed = True
              repaired.append(line)
              if 'function pfOpenVerification' in line:
                  in_modal_fields = False
          if changed:
              path.write_text('\n'.join(repaired) + '\n', encoding='utf-8')
          print('changed=', changed)
          PY
          node --check preflight-verification.js
          node --check operations-map.js
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preflight-verification.js
          git commit -m "Fix preflight verification block syntax [preflight-repaired]"
          git push origin HEAD:agent/mission-flow-sync
